<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 372' width='1520' height='744' font-family='Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='372' fill='white'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8f98'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#1d1f23'>The phone runs the game; the rest hangs off one USB hub</text><path d='M256 212H296' fill='none' stroke='#8a8f98' stroke-width='1.25' marker-end='url(#a)'/><path d='M416 212H456' fill='none' stroke='#8a8f98' stroke-width='1.25' marker-end='url(#a)'/><path d='M416 212H436V116H456' fill='none' stroke='#8a8f98' stroke-width='1.25' marker-end='url(#a)'/><path d='M416 212H436V308H456' fill='none' stroke='#8a8f98' stroke-width='1.25' marker-end='url(#a)'/><text x='276' y='202' font-size='11.5' font-weight='400' fill='#5f6670' text-anchor='middle'>USB</text><rect x='24' y='164' width='232' height='96' rx='8' fill='#e3ecfb' stroke='#2f6fdd' stroke-width='2'/><text x='36' y='188' font-size='13' font-weight='600' fill='#1d1f23' text-anchor='start'>Phone: Chrome, WebUSB</text><text x='36' y='204' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>runs the game page</text><text x='36' y='220' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>the script and the receipts</text><text x='36' y='236' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>sound to a Bluetooth speaker</text><rect x='296' y='188' width='120' height='48' rx='8' fill='white' stroke='#8a8f98' stroke-width='1.25'/><text x='356' y='216' font-size='13' font-weight='600' fill='#1d1f23' text-anchor='middle'>USB hub</text><rect x='456' y='80' width='280' height='72' rx='8' fill='white' stroke='#8a8f98' stroke-width='1.25'/><text x='468' y='104' font-size='13' font-weight='600' fill='#1d1f23' text-anchor='start'>Receipt printer</text><text x='468' y='120' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>prints every answer</text><text x='468' y='136' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>and the paper scroll itself</text><rect x='456' y='168' width='280' height='88' rx='8' fill='white' stroke='#8a8f98' stroke-width='1.25'/><text x='468' y='192' font-size='13' font-weight='600' fill='#1d1f23' text-anchor='start'>micro:bit + Wukong board</text><text x='468' y='208' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>two motors move the scroll</text><text x='468' y='224' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>light sensor finds the marks</text><text x='468' y='240' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>LED backlight, bell, two buttons</text><rect x='456' y='272' width='280' height='72' rx='8' fill='white' stroke='#8a8f98' stroke-width='1.25'/><text x='468' y='296' font-size='13' font-weight='600' fill='#1d1f23' text-anchor='start'>IBM till display, 2 x 20</text><text x='468' y='312' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>driven by a helper in Termux</text><text x='468' y='328' font-size='11.5' font-weight='400' fill='#1d1f23' text-anchor='start'>text and one big arrow</text></svg>