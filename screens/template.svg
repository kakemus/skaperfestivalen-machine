<svg xmlns="http://www.w3.org/2000/svg" width="576" height="800" viewBox="0 0 576 800">
  <!-- One screen of the scroll: 576 × 800 px = 72 × 100 mm at the printer's 8 px/mm.
       Grey = hidden behind the cassette's window frame. White = what shows (x 72–576, y 40–760 = 63 × 90 mm).
       The black bar at the left is the registration mark (added by the machine — don't draw it). -->
  <rect width="576" height="800" fill="#d9d9d9"/>
  <rect x="72" y="40" width="504" height="720" fill="#ffffff"/>
  <rect x="72.5" y="40.5" width="503" height="719" fill="none" stroke="#e0301e" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="0" y="368" width="80" height="64" fill="#000"/>
  <line x1="72" y1="400" x2="576" y2="400" stroke="#9ac" stroke-width="1" stroke-dasharray="2 6"/>
  <line x1="324" y1="40" x2="324" y2="760" stroke="#9ac" stroke-width="1" stroke-dasharray="2 6"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#555">
    <text x="324" y="26" font-size="15" text-anchor="middle">hidden (5 mm)</text>
    <text x="324" y="786" font-size="15" text-anchor="middle">hidden (5 mm)</text>
    <text x="36" y="200" font-size="13" text-anchor="middle" transform="rotate(-90 36 200)">hidden · mark + sensor</text>
    <text x="40" y="460" font-size="11" text-anchor="middle">mark</text>
    <text x="324" y="380" font-size="22" text-anchor="middle" fill="#e0301e">VISIBLE IN THE WINDOW</text>
    <text x="324" y="410" font-size="16" text-anchor="middle" fill="#e0301e">504 × 720 px · 63 × 90 mm</text>
    <text x="324" y="436" font-size="14" text-anchor="middle" fill="#888">whole screen 576 × 800 px · 72 × 100 mm · black &amp; white</text>
  </g>
</svg>
